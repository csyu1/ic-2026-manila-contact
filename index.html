
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Contact Details</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
      text-align: center;
    }

    h1 { margin-bottom: 8px; }
    .subtitle { color: #6b7280; }

    .container {
      max-width: 800px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0000000d;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e5e7eb;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      font-size: 30px;
    }

    .button {
      display: block;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      background: #111827;
      color: white;
      text-decoration: none;
    }

    .button.secondary {
      background: #f3f4f6;
      color: #111827;
    }

    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>Our Contact Details</h1>
  <p class="subtitle">Feel free to get in touch.</p>

  <main class="container">

    <section class="card">
      <div class="avatar">👤</div>
      <h2>Your Name</h2>
      <p>Contact Information</p>

      <a class="button" href="tel:+15550100001">
        Call Me
      </a>
      <a class="button secondary"
         href="mailto:you@example.com">
        Send Email
      </a>
    </section>

    <section class="card">
      <div class="avatar">👤</div>
      <h2>Wife's Name</h2>
      <p>Contact Information</p>

      <a class="button" href="tel:+15550100002">
        Call Me
      </a>
      <a class="button secondary"
         href="mailto:wife@example.com">
        Send Email
      </a>
    </section>

  </main>

  <p class="subtitle">© Our Family</p>

</body>
</html>
